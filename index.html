<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewertung abgeben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --color-bg: #F4F6F2;
  --color-card: #FFFFFF;
  --color-ink: #1B1D1B;
  --color-muted: #666B63;
  --color-border: #E4E6E0;
  --color-primary: #1F6F54;
  --color-star-inactive: #D9DBD4;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-body);
  padding: 24px;
}

.card {
  position: relative;
  width: 100%;
  max-width: 420px;
  padding: 44px 32px 32px;
  background: var(--color-card);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 24px 48px -28px rgba(0,0,0,.35);
}

.card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 6px;
  background: var(--color-primary);
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}

.brand img {
  height: 42px;
  object-fit: contain;
}

.brand .name {
  color: var(--color-muted);
  font-size: 14px;
  font-weight: 600;
}

.heading {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1.25;
  text-align: center;
}

.sub {
  margin: 0 0 30px;
  color: var(--color-muted);
  font-size: 15px;
  line-height: 1.5;
  text-align: center;
}

.stars {
  display: flex;
  flex-direction: row-reverse;
  justify-content: center;
  gap: 4px;
}

.star {
  padding: 4px;
  border: 0;
  background: none;
  cursor: pointer;
}

.star svg {
  width: 42px;
  height: 42px;
  fill: var(--color-star-inactive);
  transition: fill .15s ease;
}

.star:hover:not(:disabled) svg,
.star:hover:not(:disabled) ~ .star svg,
.star.is-selected svg {
  fill: var(--color-primary);
}

.star:disabled {
  cursor: default;
}

.change-rating {
  display: block;
  margin: 14px auto 0;
  border: 0;
  background: none;
  color: var(--color-muted);
  cursor: pointer;
  font-size: 13px;
  text-decoration: underline;
}

.panel {
  margin-top: 26px;
}

.panel[hidden] {
  display: none;
}

.redirect-text {
  margin: 0 0 14px;
  color: var(--color-muted);
  font-size: 15px;
  text-align: center;
}

.redirect-link {
  display: block;
  color: var(--color-primary);
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}

form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

label {
  display: block;
  margin-bottom: 6px;
  color: var(--color-muted);
  font-size: 13px;
}

textarea {
  width: 100%;
  min-height: 96px;
  padding: 11px 13px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: #FAFAF8;
  color: var(--color-ink);
  font: 15px var(--font-body);
  resize: vertical;
}

textarea:focus {
  outline: none;
  border-color: var(--color-primary);
}

.submit-btn {
  margin-top: 4px;
  padding: 13px 16px;
  border: 0;
  border-radius: 10px;
  background: var(--color-primary);
  color: white;
  cursor: pointer;
  font: 600 15px var(--font-body);
}

.submit-btn:disabled {
  cursor: default;
  opacity: .6;
}

.thanks {
  color: var(--color-ink);
  font-size: 15px;
  line-height: 1.5;
  text-align: center;
}
</style>
</head>

<body>
<main class="card">
  <div class="brand" id="brand"></div>

  <h1 class="heading" id="heading"></h1>
  <p class="sub" id="subheading"></p>

  <div class="stars" id="starRow" role="radiogroup" aria-label="Bewertung in Sternen">
    <button type="button" class="star" data-value="5" aria-label="5 Sterne">
      <svg viewBox="0 0 24 24">
        <path d="M12 2l2.9 6.9 7.1.6-5.4 4.6 1.6 7-6.2-3.9-6.2 3.9 1.6-7L2 9.5l7.1-.6L12 2z"/>
      </svg>
    </button>

    <button type="button" class="star" data-value="4" aria-label="4 Sterne">
      <svg viewBox="0 0 24 24">
        <path d="M12 2l2.9 6.9 7.1.6-5.4 4.6 1.6 7-6.2-3.9-6.2 3.9 1.6-7L2 9.5l7.1-.6L12 2z"/>
      </svg>
    </button>

    <button type="button" class="star" data-value="3" aria-label="3 Sterne">
      <svg viewBox="0 0 24 24">
        <path d="M12 2l2.9 6.9 7.1.6-5.4 4.6 1.6 7-6.2-3.9-6.2 3.9 1.6-7L2 9.5l7.1-.6L12 2z"/>
      </svg>
    </button>

    <button type="button" class="star" data-value="2" aria-label="2 Sterne">
      <svg viewBox="0 0 24 24">
        <path d="M12 2l2.9 6.9 7.1.6-5.4 4.6 1.6 7-6.2-3.9-6.2 3.9 1.6-7L2 9.5l7.1-.6L12 2z"/>
      </svg>
    </button>

    <button type="button" class="star" data-value="1" aria-label="1 Stern">
      <svg viewBox="0 0 24 24">
        <path d="M12 2l2.9 6.9 7.1.6-5.4 4.6 1.6 7-6.2-3.9-6.2 3.9 1.6-7L2 9.5l7.1-.6L12 2z"/>
      </svg>
    </button>
  </div>

  <button type="button" class="change-rating" id="changeRating" hidden>
    Bewertung ändern
  </button>

  <div class="panel" id="panelPositive" hidden>
    <p class="redirect-text">
      Danke! Sie werden zu Google weitergeleitet …
    </p>
    <a class="redirect-link" id="manualRedirectLink" href="#">
      Falls sich nichts tut: hier klicken
    </a>
  </div>

  <div class="panel" id="panelFeedback" hidden>
    <p class="redirect-text">
      Vielen Dank für Ihre Rückmeldung.
    </p>

    <form id="feedbackForm">
      <div>
        <label for="fbMessage">Was ist Ihnen aufgefallen?</label>
        <textarea id="fbMessage" required></textarea>
      </div>

      <button type="submit" class="submit-btn" id="fbSubmit">
        Feedback senden
      </button>
    </form>
  </div>

  <div class="panel" id="panelThanks" hidden>
    <p class="thanks">
      Vielen Dank für Ihr offenes Feedback.
    </p>
  </div>
</main>

<script>
const BUSINESSES = {
  default: {
    name: "Crispy Kebab & FFC",
    logoUrl: "",
    primaryColor: "#1F6F54",
    heading: "Wie war Ihr Aufenthalt bei Crispy Kebab & FFC?",
    subheading: "Ihre Bewertung dauert nur ein paar Sekunden.",
    googleReviewUrl:
      "https://search.google.com/local/writereview?placeid=ChIJIUZt8wIHnUcRSsVm-GM0MNU"
  },

  "cafe-sonnenblick": {
    name: "Café Sonnenblick",
    logoUrl: "",
    primaryColor: "#B5651D",
    heading: "Wie war Ihr Aufenthalt im {name}?",
    subheading: "Wir freuen uns auf Ihre Rückmeldung.",
    googleReviewUrl:
      "https://search.google.com/local/writereview?placeid=PLACE_ID_CAFE"
  },

  "friseur-glanz": {
    name: "Friseursalon Glanz",
    logoUrl: "",
    primaryColor: "#5B4B8A",
    heading: "Wie war Ihr Aufenthalt bei {name}?",
    subheading: "Eine ehrliche Einschätzung hilft uns weiter.",
    googleReviewUrl:
      "https://search.google.com/local/writereview?placeid=PLACE_ID_FRISEUR"
  }
};

const params = new URLSearchParams(window.location.search);
const bizKey = params.get("biz") || "default";
const biz = BUSINESSES[bizKey] || BUSINESSES.default;

document.title = `Bewertung – ${biz.name}`;

document.documentElement.style.setProperty(
  "--color-primary",
  biz.primaryColor || "#1F6F54"
);

const brand = document.getElementById("brand");

if (biz.logoUrl) {
  brand.innerHTML =
    `<img src="${biz.logoUrl}" alt="${biz.name}"><span class="name">${biz.name}</span>`;
} else {
  brand.innerHTML = `<span class="name">${biz.name}</span>`;
}

document.getElementById("heading").textContent =
  (biz.heading || "Wie war Ihr Besuch bei {name}?")
    .replace("{name}", biz.name);

document.getElementById("subheading").textContent =
  biz.subheading || "";

const stars = Array.from(
  document.querySelectorAll(".star")
);

const changeRatingButton =
  document.getElementById("changeRating");

const panelPositive =
  document.getElementById("panelPositive");

const panelFeedback =
  document.getElementById("panelFeedback");

const panelThanks =
  document.getElementById("panelThanks");

const manualRedirectLink =
  document.getElementById("manualRedirectLink");

manualRedirectLink.href = biz.googleReviewUrl;

let selected = 0;
let redirectTimer = null;

stars.forEach(star => {
  star.addEventListener("click", () => {
    const value = Number(star.dataset.value);

    selected = value;
    applySelection(value);
    resetPanels();

    stars.forEach(item => {
      item.disabled = true;
    });

    changeRatingButton.hidden = false;

    if (value >= 4) {
      panelPositive.hidden = false;

      redirectTimer = window.setTimeout(() => {
        window.location.href = biz.googleReviewUrl;
      }, 1100);
    } else {
      panelFeedback.hidden = false;
    }
  });
});

changeRatingButton.addEventListener("click", () => {
  if (redirectTimer) {
    window.clearTimeout(redirectTimer);
  }

  selected = 0;

  stars.forEach(star => {
    star.disabled = false;
    star.classList.remove("is-selected");
    star.setAttribute("aria-checked", "false");
  });

  changeRatingButton.hidden = true;
  resetPanels();
});

function applySelection(value) {
  stars.forEach(star => {
    const starValue = Number(star.dataset.value);

    star.classList.toggle(
      "is-selected",
      starValue <= value
    );

    star.setAttribute(
      "aria-checked",
      starValue === value ? "true" : "false"
    );
  });
}

function resetPanels() {
  panelPositive.hidden = true;
  panelFeedback.hidden = true;
  panelThanks.hidden = true;
}

document
  .getElementById("feedbackForm")
  .addEventListener("submit", event => {
    event.preventDefault();

    const message =
      document.getElementById("fbMessage").value.trim();

    if (!message) {
      return;
    }

    document.getElementById("fbSubmit").disabled = true;

    resetPanels();
    panelThanks.hidden = false;
  });
</script>
</body>
</html>
